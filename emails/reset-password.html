<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Reset your Pixinium password</title></head>
  <body style="font-family:Arial,sans-serif;color:#292027;background:#fffaf1;padding:24px;line-height:1.7">
    <h1>Reset your password</h1>
    <p>We received a request to reset your Pixinium password.</p>
    <p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="color:#96352d">Choose a new password</a></p>
    <p>If you did not request this, you can ignore this email.</p>
  </body>
</html>
