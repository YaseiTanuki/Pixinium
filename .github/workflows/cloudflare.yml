name: Cloudflare build

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: ${{ github.ref == 'refs/heads/main' && 'https://pixinium.com' || 'https://example.com' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.PIXINIUM_BUILD_SUPABASE_URL || 'https://ci-only.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.PIXINIUM_BUILD_SUPABASE_KEY || 'sb_publishable_ci_only' }}
      SEO_NOINDEX: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_DATABASE_POOL: postgresql://ci:unused@example.invalid/postgres
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_CATALOG_ADMIN_POOL: postgresql://ci:unused@example.invalid/postgres
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_AGENT_POOL: postgresql://ci:unused@example.invalid/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development
      - name: Verify thumbnails and safe runtime diagnostics
        run: node --import tsx --test --test-concurrency=1 tests/image-thumbnail.test.ts tests/cloudflare-thumbnail.test.ts tests/catalog-diagnostics.test.ts tests/content-diagnostics.test.ts tests/storage-inspection.test.ts tests/upload-tracing.test.ts tests/storage-read-transport.test.ts tests/storage-fetch-binding.test.ts tests/database.test.ts tests/database-tls.test.ts tests/database-connection.test.ts tests/supabase-schema.test.ts tests/supabase-target.test.ts tests/r2-config.test.ts
      - run: pnpm cf:build
      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --dry-run --outdir .tmp/worker-dry-run
      - name: Smoke test Workers runtime
        shell: bash
        run: |
          pnpm exec wrangler dev --port 8787 --var SEO_NOINDEX:true --var NEXT_PUBLIC_SUPABASE_URL:https://ci-only.supabase.co --var NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:sb_publishable_ci_only --var AGENT_DATABASE_URL:postgresql://ci:unused@example.invalid/postgres > /tmp/pixinium-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/pixinium-worker.log
              exit 1
            fi
            status=$(curl --silent --max-time 5 --output /tmp/robots.txt --write-out '%{http_code}' http://127.0.0.1:8787/robots.txt || true)
            if [ "$status" = 200 ]; then
              cat /tmp/robots.txt
              grep -q 'Disallow: /' /tmp/robots.txt
              # No bearer token: these routes must load and reject before any DB/S3 I/O.
              # A native dependency import failure returns an empty 500 instead.
              for endpoint in uploads content; do
                agent_status=$(curl --silent --max-time 30 --output /tmp/agent-response.json --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' "http://127.0.0.1:8787/api/agent/$endpoint" || true)
                if [ "$agent_status" != 401 ]; then
                  cat /tmp/agent-response.json
                  cat /tmp/pixinium-worker.log
                  exit 1
                fi
                node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/agent-response.json', 'utf8')); if (r.error !== 'Invalid bearer token.') process.exit(1)"
              done
              exit 0
            fi
            if [ "$status" = 500 ]; then
              sleep 2
              cat /tmp/robots.txt
              cat /tmp/pixinium-worker.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/pixinium-worker.log
          exit 1
      - name: Save production Worker bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-worker-${{ github.sha }}
          path: .open-next/
          include-hidden-files: true
          retention-days: 3
